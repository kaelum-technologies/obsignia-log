name: Witness OBSIGNIA

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: witness
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - id: run
        run: node witness.mjs
        continue-on-error: true
      - name: Record what was witnessed
        run: |
          git config user.name "obsignia-witness"
          git config user.email "obsignia-witness@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Witness: through entry $(node -p "require('./state.json').lastToSeq")"
            git push
          fi
      - name: Raise an alarm
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create obsignia-alarm --color B60205 --force
          if [ -z "$(gh issue list --label obsignia-alarm --state open --json number -q '.[].number')" ]; then
            gh issue create --title "OBSIGNIA witness alarm" --label obsignia-alarm --body-file ALARM.md
          fi
          exit 1
